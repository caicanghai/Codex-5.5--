name: secret-scan

# Secret scanning for EIOS. Complements GitHub's native secret scanning by
# checking the diff on every PR and push with Gitleaks.

on:
  push:
    branches: [eios/main, develop, 'feature/**', 'claude/**']
  pull_request:
    branches: [eios/main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
