# Dependabot — dependency scanning for EIOS.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'
    labels:
      - dependencies
      - ci

  - package-ecosystem: docker
    directory: '/deployments'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - dependencies
      - docker
