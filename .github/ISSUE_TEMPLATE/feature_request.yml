name: Feature request
description: Propose a capability for EIOS
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Target milestone
      description: See docs/ROADMAP.md
      options:
        - 'M1 — Platform Skeleton'
        - 'M2 — Identity & Tenancy'
        - 'M3 — Evidence & Interests'
        - 'M4 — Orchestration & Outbound'
        - 'M5 — Channels & Voice'
        - 'Unsure'
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Architectural boundaries
      description: Which layer owns this? Confirm no business logic lands in adapters.
    validations:
      required: false
